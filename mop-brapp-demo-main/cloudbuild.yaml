steps:
  # Build the container image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/mop-brapp-demo:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/mop-brapp-demo:latest
      - .

  # Push both tags
  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, gcr.io/$PROJECT_ID/mop-brapp-demo]

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - mop-brapp-demo
      - --image=gcr.io/$PROJECT_ID/mop-brapp-demo:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --port=8080
      - --allow-unauthenticated
      - --set-env-vars=NEXT_PUBLIC_SOCKET_SERVER_URL=wss://socket.momentofpeople.com

images:
  - gcr.io/$PROJECT_ID/mop-brapp-demo:$SHORT_SHA
  - gcr.io/$PROJECT_ID/mop-brapp-demo:latest

options:
  logging: CLOUD_LOGGING_ONLY
